<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Бесплатный кейс</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
  :root {
    --bg: #0b0d14;
    --panel: #141826;
    --blue: #4b9cff;
    --purple: #b04bff;
    --gold: #ffc83d;
    --neon: #00f0ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(ellipse at top, #1a1f36 0%, var(--bg) 60%);
    color: #fff; font-family: "Segoe UI", Roboto, Arial, sans-serif;
    overflow: hidden; user-select: none;
  }
  .app {
    min-height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 28px; padding: 16px;
  }
  h1 {
    margin: 0; font-size: 26px; letter-spacing: 3px; text-align: center;
    color: var(--neon);
    text-shadow: 0 0 8px var(--neon), 0 0 24px rgba(0,240,255,.5);
  }

  /* --- Рулетка --- */
  .roulette {
    position: relative; width: 100%; max-width: 560px; height: 150px;
    background: var(--panel); border: 1px solid #262c45; border-radius: 12px;
    overflow: hidden; box-shadow: 0 0 24px rgba(0,240,255,.12) inset;
  }
  .roulette::before, .roulette::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 70px; z-index: 2; pointer-events: none;
  }
  .roulette::before { left: 0;  background: linear-gradient(90deg, var(--bg), transparent); }
  .roulette::after  { right: 0; background: linear-gradient(-90deg, var(--bg), transparent); }
  .pointer {
    position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; z-index: 3;
    transform: translateX(-50%); background: var(--neon);
    box-shadow: 0 0 10px var(--neon), 0 0 22px var(--neon);
  }
  .pointer::before, .pointer::after {
    content: ""; position: absolute; left: 50%; transform: translateX(-50%);
    border: 8px solid transparent;
  }
  .pointer::before { top: 0;    border-top-color: var(--neon); }
  .pointer::after  { bottom: 0; border-bottom-color: var(--neon); }

  .track {
    position: absolute; left: 0; top: 0; height: 100%;
    display: flex; align-items: center; will-change: transform;
  }
  .card {
    flex: 0 0 120px; width: 120px; height: 126px; padding: 0 6px;
  }
  .card .inner {
    height: 100%; border-radius: 10px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px;
    background: linear-gradient(180deg, #1b2036, #10131f);
    border: 2px solid var(--c); border-bottom-width: 4px;
    transition: box-shadow .4s, transform .4s;
  }
  .card .amount { font-size: 28px; font-weight: 800; color: #fff; }
  .card .star { font-size: 30px; line-height: 1; }
  .card .rarity { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--c); }
  .card.rare      { --c: var(--blue); }
  .card.epic      { --c: var(--purple); }
  .card.legendary { --c: var(--gold); }

  .card.win .inner {
    transform: scale(1.08);
    box-shadow: 0 0 12px var(--c), 0 0 32px var(--c), inset 0 0 18px rgba(255,255,255,.12);
    animation: pulse 1s ease-in-out infinite alternate;
  }
  @keyframes pulse {
    from { box-shadow: 0 0 10px var(--c), 0 0 24px var(--c); }
    to   { box-shadow: 0 0 18px var(--c), 0 0 46px var(--c); }
  }

  /* --- Кнопка --- */
  button#spin {
    font-size: 20px; font-weight: 800; letter-spacing: 2px; color: #04121a;
    padding: 16px 56px; border: none; border-radius: 12px; cursor: pointer;
    background: linear-gradient(180deg, #34f5ff, #00b7d6);
    box-shadow: 0 0 18px rgba(0,240,255,.6), 0 4px 0 #007a91;
    transition: transform .1s, opacity .2s, box-shadow .1s;
  }
  button#spin:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 18px rgba(0,240,255,.6), 0 1px 0 #007a91; }
  button#spin:disabled { opacity: .45; cursor: default; }

  .result { min-height: 40px; text-align: center; }
  .result .prize { font-size: 22px; font-weight: 800; color: var(--gold); opacity: 0; transition: opacity .5s; }
  .result .note  { font-size: 12px; color: #8b93b5; margin-top: 6px; opacity: 0; transition: opacity .5s .3s; }
  .result.show .prize, .result.show .note { opacity: 1; }
  .result .prize.err { color: #ff6b6b; font-size: 15px; font-weight: 600; line-height: 1.35; padding: 0 12px; }
</style>
</head>
<body>
<div class="app">
  <h1>БЕСПЛАТНЫЙ КЕЙС</h1>

  <div class="roulette" id="roulette">
    <div class="pointer"></div>
    <div class="track" id="track"></div>
  </div>

  <button id="spin">КРУТИТЬ</button>

  <div class="result" id="result">
    <div class="prize" id="prizeText"></div>
    <div class="note" id="note"></div>
  </div>
</div>

<script>
(function () {
  // Адрес HTTP-API бота (без слэша в конце), например "https://bot.example.com".
  // Нужен, когда кейс открывается inline-кнопкой (там sendData недоступен).
  // Пусто — работает только запуск из бота командой /case (через sendData).
  const API_URL = "";

  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#0b0d14'); tg.setBackgroundColor('#0b0d14'); } catch (e) {} }

  // Призы и шансы (для ленты и демо-режима)
  const PRIZES = [
    { stars: 2,  chance: 84, cls: 'rare',      label: 'редкий' },
    { stars: 5,  chance: 15, cls: 'epic',      label: 'эпический' },
    { stars: 15, chance: 1,  cls: 'legendary', label: 'легендарный' },
  ];

  const CARD_W = 120;       // должно совпадать с .card width
  const TOTAL = 60;         // карточек в ленте
  const WIN_INDEX = 48;     // позиция остановки
  const SPIN_MS = 5000;

  const track = document.getElementById('track');
  const roulette = document.getElementById('roulette');
  const btn = document.getElementById('spin');
  const result = document.getElementById('result');
  const prizeText = document.getElementById('prizeText');
  const noteEl = document.getElementById('note');

  function weightedRandom() {
    let r = Math.random() * 100, acc = 0;
    for (const p of PRIZES) { acc += p.chance; if (r < acc) return p; }
    return PRIZES[0];
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // --- Режим работы -----------------------------------------------------------
  // senddata    — запуск из бота (/case): приз и spin пришли в ?prize=&spin=, результат уходит через sendData
  // api         — запуск inline-кнопкой: приз выдаёт и начисляет HTTP-API бота (проверка по initData)
  // unavailable — внутри Telegram, но способа связаться с ботом нет
  // demo        — открыто вне Telegram (просто посмотреть анимацию)
  const params = new URLSearchParams(location.search);
  const urlPrize = PRIZES.find(p => p.stars === parseFloat(params.get('prize')));
  const urlSpin = params.get('spin') || '';
  const inTelegram = !!(tg && tg.initData);

  let MODE;
  if (urlPrize && inTelegram) MODE = 'senddata';
  else if (API_URL && inTelegram) MODE = 'api';
  else if (inTelegram) MODE = 'unavailable';
  else MODE = 'demo';

  let winPrize = urlPrize || null;
  let spinId = urlSpin;

  function cardHTML(p, win) {
    return `<div class="card ${p.cls}${win ? ' win-target' : ''}">
      <div class="inner">
        <div class="star">⭐️</div>
        <div class="amount">${p.stars}</div>
        <div class="rarity">${p.label}</div>
      </div></div>`;
  }

  function buildTrack() {
    let html = '';
    for (let i = 0; i < TOTAL; i++) {
      html += cardHTML(i === WIN_INDEX && winPrize ? winPrize : weightedRandom(), i === WIN_INDEX);
    }
    track.innerHTML = html;
    track.style.transition = 'none';
    track.style.transform = 'translateX(0)';
  }
  buildTrack();

  // Выигрышная карточка за экраном: подменяем её, когда приз стал известен
  function setWinCard(p) {
    winPrize = p;
    const old = track.querySelector('.win-target');
    if (old) old.outerHTML = cardHTML(p, true);
  }

  function haptic(type) {
    try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(type); } catch (e) {}
  }

  function showMessage(text, isError) {
    prizeText.textContent = text;
    prizeText.classList.toggle('err', !!isError);
    result.classList.add('show');
  }

  function fireConfetti() {
    const end = Date.now() + 2200;
    const colors = ['#00f0ff', '#ffc83d', '#b04bff', '#4b9cff'];
    (function frame() {
      confetti({ particleCount: 6, angle: 60,  spread: 70, origin: { x: 0, y: 0.7 }, colors });
      confetti({ particleCount: 6, angle: 120, spread: 70, origin: { x: 1, y: 0.7 }, colors });
      if (Date.now() < end) requestAnimationFrame(frame);
    })();
    confetti({ particleCount: 140, spread: 100, origin: { y: 0.6 }, colors });
  }

  async function api(path, body) {
    const r = await fetch(API_URL + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ initData: tg.initData }, body || {})),
    });
    return r.json();
  }

  function errorText(r) {
    if (!r) return 'Не удалось связаться с ботом. Попробуйте позже.';
    if (r.error === 'bad_init_data') return 'Откройте кейс из бота.';
    return r.error || 'Кейс сейчас недоступен.';
  }

  let spinning = false;
  let claimRetry = false;

  if (MODE === 'unavailable') {
    showMessage('Откройте кейс командой /case в боте.', true);
    btn.disabled = true;
  }

  btn.addEventListener('click', async () => {
    if (spinning) return;
    if (claimRetry) { claimPrize(); return; }
    if (MODE === 'unavailable') return;

    spinning = true;
    btn.disabled = true;
    result.classList.remove('show');
    try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('medium'); } catch (e) {}

    if (MODE === 'api') {
      // Приз выбирает бот; повторное открытие даёт тот же приз
      let s = null;
      try { s = await api('/api/case/spin'); } catch (e) {}
      const p = s && s.ok ? PRIZES.find(x => x.stars === Number(s.prize)) : null;
      if (!p) {
        showMessage(errorText(s), true);
        spinning = false; btn.disabled = false;
        return;
      }
      spinId = s.spin_id;
      setWinCard(p);
    } else if (MODE === 'demo') {
      setWinCard(weightedRandom());
    }

    // Центр выигрышной карточки под указателем + небольшой сдвиг внутри карточки
    const jitter = (Math.random() - 0.5) * (CARD_W * 0.6);
    const target = WIN_INDEX * CARD_W + CARD_W / 2 - roulette.clientWidth / 2 + jitter;

    void track.offsetWidth; // reflow, чтобы transition сработал
    track.style.transition = `transform ${SPIN_MS}ms cubic-bezier(0.08, 0.6, 0.12, 1)`;
    track.style.transform = `translateX(${-target}px)`;

    setTimeout(onFinish, SPIN_MS + 100);
  });

  function onFinish() {
    const winCard = track.querySelector('.win-target');
    if (winCard) winCard.classList.add('win');

    showMessage(`Вы выиграли ${winPrize.stars} ⭐️`, false);
    fireConfetti();
    haptic('success');

    if (MODE === 'senddata') {
      // Через 3 секунды отправляем результат боту (Telegram закроет окно).
      // Сумму бот берёт из своей БД, spin_id защищает от двойного начисления.
      noteEl.textContent = 'звезды начислены на баланс бота';
      setTimeout(() => {
        tg.sendData(JSON.stringify({ action: 'claim_case', spin_id: spinId, stars: winPrize.stars }));
      }, 3000);
    } else if (MODE === 'api') {
      claimPrize();
    } else {
      noteEl.textContent = 'демо-режим: звёзды не начисляются';
    }
  }

  // Начисление через HTTP-API бота: 3 попытки; если связи нет — кнопка «ЗАБРАТЬ ПРИЗ».
  // Приз при этом не пропадает: он сохранён на стороне бота под этим spin_id.
  async function claimPrize() {
    btn.disabled = true;
    noteEl.textContent = 'начисляем звёзды...';
    for (let i = 0; i < 3; i++) {
      let r = null;
      try { r = await api('/api/case/claim', { spin_id: spinId }); } catch (e) {}
      if (r && r.ok) {
        claimRetry = false;
        noteEl.textContent = 'звезды начислены на баланс бота';
        haptic('success');
        setTimeout(() => { try { tg.close(); } catch (e) {} }, 3500);
        return;
      }
      if (r && r.status && r.status !== 'ok' && r.status !== 'already') {
        // бот ответил отказом (условия кейса не выполнены) — повторять бессмысленно
        noteEl.textContent = '';
        showMessage(errorText(r), true);
        return;
      }
      await sleep(1500);
    }
    claimRetry = true;
    spinning = false;
    noteEl.textContent = 'нет связи с ботом — нажмите кнопку, приз сохранён';
    btn.textContent = 'ЗАБРАТЬ ПРИЗ';
    btn.disabled = false;
  }
})();
</script>
</body>
</html>
